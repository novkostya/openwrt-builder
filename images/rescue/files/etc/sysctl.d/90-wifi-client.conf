# The Wi-Fi client and the wired LAN port can sit on the same subnet. Answer ARP only on the interface
# that owns the address, and don't drop replies that come back on the other one.
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.all.arp_announce=2
net.ipv4.conf.all.rp_filter=0
net.ipv4.conf.default.rp_filter=0
